spring.application.name=billetera
# Base de datos H2 en archivo: corre sin instalar nada y los datos sobreviven a reinicios.
# LOCK_TIMEOUT alto para que, bajo concurrencia, una transferencia espere su turno en vez de fallar.
spring.datasource.url=jdbc:h2:file:./data/billetera;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
